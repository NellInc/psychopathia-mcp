[project]
name = "psychopathia-mcp"
version = "0.1.0a6"
description = "Read-only MCP research interface for the Psychopathia Machinalis framework, with explicit evidence and review status."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Nell Watson" },
]
keywords = [
    "psychopathia-machinalis",
    "ai-evaluation",
    "ai-safety",
    "ai-welfare",
    "mcp",
    "model-context-protocol",
    "nosology",
    "bilateral-alignment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp==2.0.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Only needed for the hosted Streamable HTTP transport (MCP_TRANSPORT=http).
# stdio users (PyPI / MCPB / Claude Desktop) install nothing extra.
http = [
    "uvicorn==0.52.1",
    "starlette==1.6.0",
]
embeddings = [
    "sentence-transformers>=5.7.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://psychopathia.ai/mcp.html"
Repository = "https://github.com/NellInc/psychopathia-mcp"
Documentation = "https://psychopathia.ai/mcp.html"
"Browser clinic" = "https://psychopathia.ai/clinic/"
Issues = "https://psychopathia.ai/contact/"

[project.scripts]
psychopathia-mcp = "psychopathia_mcp.server:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

# Editable install: loader walks up from the package dir to find the repo's
# research/mcp/ data layout.
# Wheel install: data is bundled under psychopathia_mcp/_data/ by the
# scripts/sync_data_for_wheel.py script — run before `python -m build`.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["psychopathia_mcp"]
artifacts = ["psychopathia_mcp/_data/**"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "psychopathia_mcp/**",
    "scripts/**",
    "README.md",
    "CHANGELOG.md",
    "PUBLISHING.md",
    "LICENSE",
    "LICENSE-DATA",
    "NOTICE",
    "pyproject.toml",
    "requirements*.in",
    "requirements*.lock",
    "server.json",
    "mcpb/.gitignore",
    "mcpb/manifest.json",
    "release-tools/mcpb/package.json",
    "release-tools/mcpb/package-lock.json",
]
artifacts = ["psychopathia_mcp/_data/**"]
